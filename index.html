<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f1419; --panel:#1a2129; --panel2:#222b35; --line:#2c3742;
    --ink:#e8edf2; --muted:#8a98a8; --muted2:#5d6b7a;
    --amber:#f5a623; --amber-dim:#a8731a; --green:#3ec98a; --red:#ef5b5b; --blue:#4aa8ff;
    --content:#f4f1ea;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'IBM Plex Sans',sans-serif;background:var(--bg);color:var(--ink);display:flex;min-height:100vh;font-size:14px}
  .mono{font-family:'IBM Plex Mono',monospace}
  aside{width:236px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;flex-shrink:0}
  .brand{padding:20px 20px;border-bottom:1px solid var(--line)}
  .brand h1{font-size:15px;font-weight:700;letter-spacing:.5px;display:flex;align-items:center;gap:9px}
  .brand .dot{width:11px;height:11px;background:var(--amber);border-radius:2px;transform:rotate(45deg)}
  .brand p{font-size:10.5px;color:var(--muted2);margin-top:4px;letter-spacing:1.5px;text-transform:uppercase}
  nav{padding:10px 10px;flex:1;overflow-y:auto}
  nav button{width:100%;text-align:left;background:none;border:none;color:var(--muted);padding:10px 13px;border-radius:8px;cursor:pointer;font-family:inherit;font-size:13.5px;display:flex;align-items:center;gap:11px;margin-bottom:2px;transition:.15s;font-weight:500}
  nav button:hover{background:var(--panel2);color:var(--ink)}
  nav button.active{background:var(--amber);color:#1a1206;font-weight:600}
  nav button .ic{width:18px;text-align:center;font-size:15px}
  nav button .badge{margin-left:auto;background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:1px 7px;border-radius:10px}
  nav button.active .badge{background:#1a1206;color:var(--amber)}
  .navsep{font-size:9.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted2);padding:14px 14px 6px;font-weight:600}
  .navgrp-hd{display:flex;align-items:center;justify-content:space-between;padding:10px 13px 6px;margin-top:4px;font-size:9.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted2);font-weight:600;cursor:pointer;border-radius:8px}
  .navgrp-hd:hover{color:var(--muted)}
  .navgrp-hd .navgrp-hd-l{display:flex;align-items:center;gap:6px}
  .navgrp-hd .navgrp-chev{font-size:10px;transition:transform .15s}
  .navgrp-hd .badge{background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:1px 7px;border-radius:10px}
  .navgrp-body button{padding-left:13px}
  .navgrp-divider{border-top:1px solid var(--line);margin:10px 6px 6px}
  .side-foot{padding:14px 18px;border-top:1px solid var(--line);font-size:10.5px;color:var(--muted2);line-height:1.6}
  main{flex:1;background:var(--content);color:#1c1c1c;min-width:0}
  .topbar{background:#fff;border-bottom:2px solid #e4dfd4;padding:16px 30px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20;gap:16px;flex-wrap:wrap}
  .topbar h2{font-size:19px;font-weight:700}
  .topbar h2 small{display:block;font-size:12px;font-weight:400;color:#8a8377;margin-top:2px}
  .wrap{padding:26px 30px;max-width:1200px}
  .cards{display:flex;flex-wrap:wrap;gap:16px;margin-bottom:24px}
  .cards>.card{flex:1 1 220px}
  .card{background:#fff;border:1px solid #e4dfd4;border-radius:12px;padding:18px 20px;position:relative;overflow:hidden}

/* ===== Modo offline: cache local + fila de sincronização ===== */
let isOnline=navigator.onLine;
const OFFLINE_KEY='estoque_offline_queue_v1', CACHE_KEY='estoque_cache_v1';
function cacheState(){ try{ localStorage.setItem(CACHE_KEY, JSON.stringify({state,photos})); }catch(e){} }
function loadCache(){ try{ const d=JSON.parse(localStorage.getItem(CACHE_KEY)); if(d&&d.state&&d.state.products){ state=d.state; photos=d.photos||{}; return true; } }catch(e){} return false; }
function getQueue(){ try{return JSON.parse(localStorage.getItem(OFFLINE_KEY)||'[]');}catch(e){return [];} }
function setQueue(q){ try{localStorage.setItem(OFFLINE_KEY, JSON.stringify(q));}catch(e){} updateOfflineBadge(); }
function queueAction(type,payload,label){ const q=getQueue(); q.push({id:uid(),type,payload,label,ts:Date.now()}); setQueue(q); }
function updateOfflineBadge(){ const el=$('#offlineBadge'); if(!el)return; const n=getQueue().length;
  if(!isOnline){ el.style.display='flex'; el.className='offbadge off noprint'; el.textContent='📴 Offline'+(n?' · '+n+' pendente(s)':''); }
  else if(n>0){ el.style.display='flex'; el.className='offbadge sync noprint'; el.textContent='🔄 Sincronizando '+n+' pendente(s)...'; }
  else { el.style.display='none'; }
}
let syncingQueue=false;
async function processOfflineQueue(){
  if(syncingQueue||!isOnline)return; const q0=getQueue(); if(!q0.length)return; syncingQueue=true;
  let q=q0;
  while(q.length && isOnline){
    const act=q[0];
    try{
      if(act.type==='requisicao'){ const {error}=await sb.from('requisicoes').insert(act.payload); if(error)throw error; }
      q=q.slice(1); setQueue(q);
    }catch(e){ console.error('Falha ao sincronizar pendência offline',e); break; }
  }
  syncingQueue=false; updateOfflineBadge();
  if(getQueue().length===0 && q0.length>0){ toast('Tudo sincronizado.','ok'); cacheState(); refreshBadge(); if(SAFE_REFRESH_TABS.includes(activeTab))go(activeTab); }
}
window.addEventListener('online',()=>{ isOnline=true; updateOfflineBadge(); if(getQueue().length){toast('Conexão de volta — sincronizando pendências...','ok'); processOfflineQueue();} });
window.addEventListener('offline',()=>{ isOnline=false; updateOfflineBadge(); toast('Sem conexão — as próximas ações ficam guardadas neste aparelho.','warn'); });
const SAFE_REFRESH_TABS=['obras','aplic','produtos','consulta','relatorios'];
function subscribeRealtime(){
  sb.channel('app_kv_sync').on('postgres_changes',{event:'UPDATE',schema:'public',table:'app_kv',filter:'key=eq.'+KEY},payload=>{
    if(!payload.new||!payload.new.value)return;
    state=payload.new.value;
    if(!state.obras)state.obras=[]; if(!state.aplicacoes)state.aplicacoes=[]; if(!state.estoque)state.estoque={}; if(!state.movements)state.movements=[]; if(!state.notas)state.notas=[]; if(!state.seq)state.seq={baixa:0,transfer:0}; if(!state.empresas)state.empresas=[];
    if(!state.currentObra||!state.obras.some(o=>o.id===state.currentObra))state.currentObra=state.obras[0]?state.obras[0].id:null;
    refreshBadge(); refreshAprovBadge(); refreshGlobalAlerts();
    if(SAFE_REFRESH_TABS.includes(activeTab))go(activeTab);
  }).subscribe();
  // Requisições (aprovação/separação/expedição/etc.) mudam em tabelas normalizadas do Postgres,
  // sem passar pelo app_kv — sem isto, uma exclusão/decisão feita por outra pessoa (ou em outra
  // aba) só aparecia depois de sair e voltar na tela. Isso mantém tudo ao vivo.
  sb.channel('requisicoes_sync').on('postgres_changes',{event:'*',schema:'public',table:'requisicoes'},()=>{
    if(activeTab==='baixa'){ drawMinhasFrotasPendentes(); drawMinhasEmAndamento(); }
    if(activeTab==='aprovacoes'){ drawAprovPend(); drawAprovHist(); }
    if(activeTab==='separacao'&&typeof drawSeparacaoList==='function')drawSeparacaoList();
    if(activeTab==='expedicao'&&typeof drawExpedicaoList==='function')drawExpedicaoList();
    if(activeTab==='retiradas'&&typeof drawRetiradaPendente==='function')drawRetiradaPendente();
    refreshAprovBadge(); refreshSeparacaoBadge(); refreshExpedBadge(); refreshRetiradasBadge(); refreshComprasBadge(); refreshMinhasBadge(); refreshGlobalAlerts();
  }).subscribe();
}

function resizeImage(file,max,cb){ const r=new FileReader(); r.onload=e=>{ const img=new Image();
  img.onload=()=>{ let w=img.width,h=img.height; if(w>h){if(w>max){h=Math.round(h*max/w);w=max;}}else{if(h>max){w=Math.round(w*max/h);h=max;}}
    const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);cb(c.toDataURL('image/jpeg',0.72)); };
  img.onerror=()=>toast('Não foi possível ler a imagem.','err'); img.src=e.target.result; }; r.readAsDataURL(file); }

function defaultSedeObra(){ const m=state.obras.find(o=>/sede|almox|matriz/i.test(o.nome)); return m?m.id:(curObra()&&curObra()!=='__all'?curObra():(state.obras[0]?state.obras[0].id:null)); }
function periodTs(){ const f=$('#dashFrom')&&$('#dashFrom').value?new Date($('#dashFrom').value+'T00:00:00').getTime():0; const t=$('#dashTo')&&$('#dashTo').value?new Date($('#dashTo').value+'T23:59:59').getTime():Date.now(); return [f,t]; }
function movDeltaVal(m,obraId){ const p=findProduct(m.code); const c=p?(p.custo||0):0;
  if(obraId==='__all'){ if(m.tipo==='entrada')return m.qty*c; if(m.tipo==='baixa')return -m.qty*c; return 0; }
  if(m.tipo==='entrada')return m.obra===obraId?m.qty*c:0;
  if(m.tipo==='baixa')return m.obra===obraId?-m.qty*c:0;
  if(m.tipo==='transferencia'){ let d=0; if(m.obra===obraId)d-=m.qty*c; if(m.obraDest===obraId)d+=m.qty*c; return d; }
  return 0; }

function emiMap(){ const m={}; state.notas.forEach(n=>{ if(n.dataEmissao)m[n.id]=new Date(n.dataEmissao+'T12:00:00').getTime(); }); return m; }
function mdate(m,emi){ if(m.tipo==='entrada'&&m.notaId&&emi[m.notaId])return emi[m.notaId]; return m.ts; }

  const valEstoque = isAll ? state.products.reduce((s,p)=>s+totalSaldo(p.code)*(p.custo||0),0) : state.products.reduce((s,p)=>s+saldoOf(fobra,p.code)*(p.custo||0),0);

  const res=$('#obraResumo'); if(res){ let rows=state.obras.map(ob=>{ let itens=0,val=0; state.products.forEach(p=>{const s=saldoOf(ob.id,p.code); if(s>0){itens++;val+=s*(p.custo||0);}});

  // gráfico — por data de emissão (entradas) / data (saídas e transf.), respeitando o filtro de obra
  if($('#evoTitle'))$('#evoTitle').textContent='Evolução do estoque — '+esc(fobraLbl);

  all.forEach(x=>{ if(x.d>=f&&x.d<=t){ running+=movDeltaVal(x.m,co); labels.push(new Date(x.d).toLocaleDateString('pt-BR')); data.push(running); } });
  labels.push(new Date(t).toLocaleDateString('pt-BR')); data.push(running);
  const cv=$('#evoChart'); if(cv&&window.Chart){ if(evoChartObj){evoChartObj.destroy();}
    evoChartObj=new Chart(cv.getContext('2d'),{type:'line',data:{labels,datasets:[{label:'Valor em estoque (R$)',data,borderColor:'#f5a623',backgroundColor:'rgba(245,166,35,.12)',fill:true,tension:.2,pointRadius:data.length>40?0:3}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>money(c.parsed.y)}}},scales:{y:{ticks:{callback:v=>'R$ '+Number(v).toLocaleString('pt-BR')}}}}}); }
}

function addNfExisting(code){ const p=findProduct(code); if(!p)return; const ex=nfItems.find(i=>i.code===code); if(ex){ex.qty=(ex.qty||0)+1;} else nfItems.push({code:p.code,desc:p.desc,unit:p.unit,qty:1,custo:p.custo||0,preco:p.preco||0}); if($('#nfSearch'))$('#nfSearch').value=''; if($('#nfSearchResults'))$('#nfSearchResults').innerHTML=''; drawNfItems(); if($('#nfSearch'))$('#nfSearch').focus(); }
function tagsOf(root,name){ let r=root.getElementsByTagName(name); if(r.length)return r; return root.getElementsByTagNameNS('*',name); }
function txt(root,name){ const n=tagsOf(root,name)[0]; return n?n.textContent.trim():''; }
function importXml(content){
  try{
    const doc=new DOMParser().parseFromString(content,'text/xml');
    if(doc.getElementsByTagName('parsererror').length){toast('XML inválido.','err');return;}
    const ide=tagsOf(doc,'ide')[0]; const nNF=ide?txt(ide,'nNF'):'';
    const emit=tagsOf(doc,'emit')[0]; const forn=emit?txt(emit,'xNome'):'';
    const dets=[...tagsOf(doc,'det')];
    if(!dets.length){toast('Não encontrei itens (det) no XML.','err');return;}
    let add=0;
    dets.forEach(det=>{ const prod=tagsOf(det,'prod')[0]; if(!prod)return;
      const cEAN=txt(prod,'cEAN'); const cProd=txt(prod,'cProd');
      const code=/^\d{8,14}$/.test(cEAN)?cEAN:(cProd||genCode());
      const qty=parseFloat(txt(prod,'qCom'))||parseFloat(txt(prod,'qTrib'))||0;
      const custo=parseFloat(txt(prod,'vUnCom'))||parseFloat(txt(prod,'vUnTrib'))||0;
      nfItems.push({code, desc:txt(prod,'xProd'), unit:(txt(prod,'uCom')||'UN').toUpperCase(), qty, custo, preco:0}); add++; });
    if(nNF&&$('#nfNum'))$('#nfNum').value=nNF; if(forn&&$('#nfForn'))$('#nfForn').value=forn;
    const dhEmi=ide?(txt(ide,'dhEmi')||txt(ide,'dEmi')):''; if(dhEmi&&$('#nfData'))$('#nfData').value=dhEmi.slice(0,10);
    const emitCnpj=emit?txt(emit,'CNPJ'):''; if(emitCnpj&&$('#nfCnpjEmit'))$('#nfCnpjEmit').value=emitCnpj;
    const dest=tagsOf(doc,'dest')[0]; const destDoc=dest?(txt(dest,'CNPJ')||txt(dest,'CPF')):''; if(destDoc&&$('#nfCnpjTom'))$('#nfCnpjTom').value=destDoc;
    if($('#xmlText'))$('#xmlText').value='';
    drawNfItems(); toast(`XML lido · ${add} item(ns) carregado(s).`,'ok');
  }catch(e){ toast('Erro ao ler XML: '+e.message,'err'); }
}
function addNfItem(){ const desc=$('#itDesc').value.trim(); const qty=parseFloat($('#itQty').value);
  if(!desc){toast('Informe a descrição.','err');return;} if(!(qty>0)){toast('Quantidade inválida.','err');return;}
  const refTxt=($('#itRef')?$('#itRef').value.trim():''); const aplicId=($('#itAplic')&&$('#itAplic').value)?$('#itAplic').value:'';
  let ref=refTxt; if(aplicId){const an=aplicName(aplicId); ref=(ref?ref+' · ':'')+'Aplicação: '+an;}

  let tot=0; b.innerHTML=nfItems.map((it,i)=>{const t=(it.qty||0)*(it.custo||0);tot+=t;const ex=it.code&&findProduct(it.code);

  $('#nfTotal').textContent=money(tot); }
function setNfQty(i,v){ if(nfItems[i])nfItems[i].qty=parseFloat(v)||0; refreshNfTotals(); }
function setNfCusto(i,v){ if(nfItems[i])nfItems[i].custo=parseFloat(v)||0; refreshNfTotals(); }
function refreshNfTotals(){ let tot=0; nfItems.forEach((it,i)=>{const t=(it.qty||0)*(it.custo||0);tot+=t;const c=$('#nft_'+i);if(c)c.textContent=money(t);}); if($('#nfTotal'))$('#nfTotal').textContent=money(tot); }
function processNf(force){
  if(!nfItems.length){toast('Adicione ao menos um item.','err');return;}
  const obra=$('#nfObra').value; const numero=$('#nfNum').value.trim()||'s/nº'; const forn=$('#nfForn').value.trim(); const dataEmissao=$('#nfData').value||'';
  const cnpjTom=$('#nfCnpjTom')?$('#nfCnpjTom').value.trim():''; const cnpjEmit=$('#nfCnpjEmit')?$('#nfCnpjEmit').value.trim():'';
  const totalCheck=nfItems.reduce((s,it)=>s+it.qty*it.custo,0);
  const dup=state.notas.find(n=>n.numero===numero && (n.forn||'')===forn && (n.cnpjTomador||'')===cnpjTom && (n.dataEmissao||'')===dataEmissao && Math.abs((n.valor||0)-totalCheck)<0.01);
  if(dup && !force){ modal(`<h3>⚠ Possível nota duplicada</h3><p class="mp">Já existe uma nota com <b>mesmo número, fornecedor, CNPJ do tomador, data de emissão e valor</b> (lançada em ${fmtDate(dup.ts)}, obra ${esc(obraName(dup.obra))}). Lançar mesmo assim?</p><div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn danger" onclick="closeModal();processNf(true)">Lançar assim mesmo</button></div>`); return; }
  const doc=`NF ${numero}${forn?' · '+forn:''}`; const notaId=uid(); const ts=Date.now();
  let alerts=[], total=0; const notaItens=[];
  nfItems.forEach(it=>{ let p=it.code?findProduct(it.code):null;
    if(!p){ const code=it.code||genCode(); p={code,desc:it.desc,unit:it.unit,aux:'',min:0,max:0,custo:0,preco:it.preco||0,ref:it.ref||''}; state.products.push(p); }
    else if(it.ref && !p.ref){ p.ref=it.ref; }
    const qAnt=totalSaldo(p.code);
    if(it.custo>0){ const novo=qAnt+it.qty; p.custo=novo>0?((qAnt*(p.custo||0))+(it.qty*it.custo))/novo:it.custo; }
    if(it.preco>0)p.preco=it.preco; if(it.desc&&p.desc!==it.desc)p.desc=it.desc;
    addSaldo(obra,p.code,it.qty); total+=it.qty*it.custo; notaItens.push({code:p.code,desc:p.desc,qty:it.qty,custo:it.custo,unit:p.unit});
    state.movements.unshift({id:uid(),ts,tipo:'entrada',obra,notaId,code:p.code,desc:p.desc,qty:it.qty,valorUnit:it.custo,valorTotal:it.qty*it.custo,doc,saldo:saldoOf(obra,p.code)});
    if(p.max>0&&saldoOf(obra,p.code)>p.max)alerts.push(`${p.desc}: ${numf(saldoOf(obra,p.code))} acima do máximo`);
  });
  state.notas.unshift({id:notaId,numero,forn,dataEmissao,cnpjTomador:cnpjTom,cnpjEmit,obra,valor:total,itens:notaItens,ts});
  save('Entrada NF '+numero+' em '+obraName(obra)); const n=nfItems.length; nfItems=[];
  toast(`Entrada em ${esc(obraName(obra))} · ${n} item(ns).`,'ok'); alerts.forEach(a=>toast('⚠ '+a,'warn'));
  go('produtos');
}

function labelFilteredList(q){ q=String(q||'').toLowerCase().trim(); if(!q)return state.products; return state.products.filter(p=>p.desc.toLowerCase().includes(q)||String(p.code).toLowerCase().includes(q)||(p.aux&&String(p.aux).toLowerCase().includes(q))); }
function drawLabelRows(q){ const box=$('#labelRows'); if(!box)return; const list=labelFilteredList(q);
  box.innerHTML=list.length?list.map(p=>{ const checked=labelSel.hasOwnProperty(p.code); const qty=checked?labelSel[p.code]:1;
    return `<tr><td><input type="checkbox" ${checked?'checked':''} onchange="toggleLabelSel('${esc(p.code)}',this.checked)"></td>

function toggleLabelSel(code,on){ if(on){ labelSel[code]=labelSel[code]||1; } else { delete labelSel[code]; } drawLabelRows($('#labelSearch')?$('#labelSearch').value:''); }
function setLabelQty(code,v){ const n=Math.max(1,parseInt(v)||1); if(labelSel.hasOwnProperty(code))labelSel[code]=n; updateLabelCount(); }

function generateLabels(){ const codes=Object.keys(labelSel); if(!codes.length){toast('Selecione ao menos um produto.','err');return;}

function printLabels(items,type){

  const w=window.open('','_blank'); if(!w){toast('Permita pop-ups para gerar as etiquetas.','err');return;}
  const libTag=type==='qrcode'?'':'<script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js"><\/script>';
  w.document.write(`<html><head><meta charset="utf-8"><title>Etiquetas</title>${libTag}<style>@page{size:auto;margin:8mm}body{font-family:sans-serif;margin:0}.lab{display:inline-block;padding:8px 6px;margin:4px;text-align:center;width:200px;vertical-align:top;page-break-inside:avoid;break-inside:avoid}.lab .d{font-size:11.5px;font-weight:bold;margin-bottom:2px;line-height:1.25;word-wrap:break-word}.lab .a{font-size:10px;color:#555;margin-bottom:4px}.lab svg{width:100%;height:auto;display:block}.lab .qrwrap{display:flex;justify-content:center;margin:4px 0}</style></head><body>`);
  if(type==='qrcode'){
    let idx=0; const initCalls=[];

      w.document.write(`<div class="lab"><div class="d">${esc(p.desc)}</div>${p.aux?`<div class="a">Aux: ${esc(p.aux)}</div>`:''}<div class="qrwrap" id="${elId}"></div></div>`);

      idx++; } });
    w.document.write(`<script>var qrcode=window.opener.qrcode;${initCalls.join('')}setTimeout(()=>window.print(),400);<\/script></body></html>`);
  } else {
    items.forEach(({p,qty})=>{ for(let i=0;i<qty;i++){ w.document.write(`<div class="lab"><div class="d">${esc(p.desc)}</div>${p.aux?`<div class="a">Aux: ${esc(p.aux)}</div>`:''}<svg class="b" data-c="${esc(p.code)}"></svg></div>`); } });
    w.document.write(`<script>document.querySelectorAll('.b').forEach(s=>{JsBarcode(s,s.dataset.c,{format:'CODE128',width:1.3,height:50,fontSize:13,margin:4});const bw=s.getAttribute('width'),bh=s.getAttribute('height');if(bw&&bh){s.setAttribute('viewBox','0 0 '+bw+' '+bh);s.removeAttribute('width');s.removeAttribute('height');}});setTimeout(()=>window.print(),400);<\/script></body></html>`);
  }
  w.document.close(); }

function lookupScanPick(code){ if($('#scanResults'))$('#scanResults').innerHTML=''; lookupScan(code,true); }
function lookupScan(code,exactCode){ code=String(code).trim(); if(!code)return; const o=curObra()==='__all'?state.obras[0].id:curObra();
  let p=findByCodeOrAux(code) || (exactCode?findProduct(code):null); const fc=$('#foundCard');

    ${s<=0?'<div style="background:#fdeaea;border:1px solid #e0a0a0;border-radius:8px;padding:8px 12px;margin-top:8px;font-size:12px;color:#a02525">Sem saldo nesta obra — a quantidade pedida vai virar compra pendente após a aprovação.</div>':''}
    <div class="field" style="margin:8px 0 0"><label>Quantidade a solicitar</label><input id="baixaQty" type="number" step="any" min="0" autofocus></div>
    <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:14px"><button class="btn ghost" onclick="cancelBaixa()">Cancelar</button><button class="btn primary" onclick="addScanToCart()">+ Adicionar à lista</button></div>`;
  $('#scanInput').value=''; const bq=$('#baixaQty'); bq.focus(); bq.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();addScanToCart();}});
}
function addScanToCart(){ const p=baixaProduct; if(!p)return; const o=curObra()==='__all'?state.obras[0].id:curObra();
  const qty=parseFloat($('#baixaQty').value); if(!(qty>0)){toast('Informe a quantidade.','err');return;}
  const s=saldoOf(o,p.code); const ex=saidaCart.find(i=>i.code===p.code); const have=ex?(ex.qty||0):0;
  if(have+qty>s){toast(`Atenção: ${p.desc} ficará com falta (disponível ${numf(s)}) — vai gerar compra pendente após aprovação.`,'warn');}
  if(ex)ex.qty=have+qty; else saidaCart.push({code:p.code,qty});
  baixaProduct=null; const fc=$('#foundCard'); if(fc)fc.className='found-card'; drawSaidaCart(o);
  if($('#scanInput')){$('#scanInput').value='';$('#scanInput').focus();} }
function cancelBaixa(){ baixaProduct=null; const fc=$('#foundCard'); if(fc)fc.className='found-card'; if($('#scanInput'))$('#scanInput').focus(); }
/* --- manual / saída de material --- */
function drawSaidaResults(q,o){ const box=$('#saidaResults'); if(!box)return; const list=searchProducts(q).slice(0,8);
  if(!q||!list.length){ box.innerHTML=q&&!list.length?`<div class="muted" style="font-size:12px;padding:8px 2px">Nenhum item encontrado.</div>`:''; return; }
  box.innerHTML=`<div class="tbl-wrap" style="margin-top:10px"><table><tbody>`+list.map(p=>`<tr><td>${esc(p.desc)}<br><span class="muted" style="font-size:11px">${esc(p.code)}${p.aux?' · aux '+esc(p.aux):''} · saldo ${numf(saldoOf(o,p.code))} ${esc(p.unit||'')}</span></td><td class="num" style="width:80px"><button class="btn ghost sm" onclick="addSaida('${esc(p.code)}')">+ Add</button></td></tr>`).join('')+`</tbody></table></div>`; }
function addSaida(code){ const o=curObra()==='__all'?state.obras[0].id:curObra(); if(!saidaCart.some(i=>i.code===code))saidaCart.push({code,qty:1}); if($('#saidaSearch'))$('#saidaSearch').value=''; if($('#saidaResults'))$('#saidaResults').innerHTML=''; drawSaidaCart(o); if($('#saidaSearch'))$('#saidaSearch').focus(); }
function rmSaida(code){ saidaCart=saidaCart.filter(i=>i.code!==code); const o=curObra()==='__all'?state.obras[0].id:curObra(); drawSaidaCart(o); }
function setSaidaQty(code,v){ const it=saidaCart.find(i=>i.code===code); if(it)it.qty=parseFloat(v)||0; const p=findProduct(code); const cell=$('#sv_'+CSS.escape(code)); if(cell&&p)cell.textContent=money((it?it.qty:0)*((p.custo)||0)); updateSaidaTotal(); }
function drawSaidaCart(o){ const b=$('#saidaCartBody'); if(!b)return;
  if(!saidaCart.length){ b.innerHTML=`<tr><td colspan="5" class="empty" style="padding:20px">Nenhum item. Pesquise acima e adicione.</td></tr>`; updateSaidaTotal(); return; }
  b.innerHTML=saidaCart.map(i=>{const p=findProduct(i.code);const s=saldoOf(o,i.code);const tot=(i.qty||0)*((p.custo)||0);return `<tr><td>${esc(p.desc)}<br><span class="muted" style="font-size:11px">${esc(p.code)}${p.aux?' · aux '+esc(p.aux):''}</span></td><td class="num ${s<=0?'neg':''}">${numf(s)} ${esc(p.unit||'')}</td><td class="num"><input class="inline-edit" type="number" step="any" min="0" value="${i.qty}" oninput="setSaidaQty('${esc(i.code)}',this.value)"></td><td class="num" id="sv_${esc(i.code)}">${money(tot)}</td><td class="num"><button class="btn danger sm" onclick="rmSaida('${esc(i.code)}')">✕</button></td></tr>`;}).join(''); updateSaidaTotal(); }
function confirmSaida(){ const o=curObra()==='__all'?state.obras[0].id:curObra(); if(!saidaCart.length){toast('Adicione itens à solicitação.','err');return;}
  const itens=saidaCart.filter(i=>i.qty>0); if(!itens.length){toast('Informe as quantidades.','err');return;}
  if(!state.aplicacoes.length){toast('Cadastre uma aplicação antes de solicitar.','err');return;}
  const aplic=($('#saidaAplic')?$('#saidaAplic').value:''); if(!aplic){toast('Informe a aplicação (obrigatório).','err'); if($('#saidaAplicSearch'))$('#saidaAplicSearch').focus(); return;}
  const os=($('#saidaOS')?$('#saidaOS').value.trim():''); if(aplicRequerOS(aplic)&&!os){ toast('Ordem de Serviço é obrigatória para Equipamento/Veículo.','err'); if($('#saidaOS'))$('#saidaOS').focus(); return; }
  const resp=($('#saidaResp')?$('#saidaResp').value.trim():''); const obs=($('#saidaObs')?$('#saidaObs').value.trim():'');
  const mutuoChk=$('#saidaMutuo'); let mutuoFields={};
  if(mutuoChk&&mutuoChk.checked){
    const destObraId=$('#saidaMutuoObra')?$('#saidaMutuoObra').value:'';
    if(!destObraId){toast('Selecione a obra de destino do mútuo.','err');return;}
    const oOrig=state.obras.find(x=>x.id===o), oDest=state.obras.find(x=>x.id===destObraId);
    mutuoFields={mutuo_empresa_origem:oOrig.empresa,mutuo_empresa_destino:oDest.empresa,mutuo_obra_destino_nome:oDest.nome};
  }

  const payload={obra_id:o,obra_nome:obraName(o),solicitante_id:session.user.id,solicitante_nome:profile.nome||profile.email,
    itens:itens.map(i=>{const p=findProduct(i.code); return {code:p.code,desc:p.desc,unit:p.unit,qty:i.qty};}),
    observacao:(obs||resp?[obs,resp?('Solicitante: '+resp):''].filter(Boolean).join(' · '):null),ordem_servico:os||null,aplicacao_id:aplic,aplicacao_nome:aplicName(aplic),...mutuoFields};
  const finish=()=>{ saidaCart=[]; drawBaixaHist(); drawMinhasFrotasPendentes(); setBaixaMode(baixaMode); };
  if(!isOnline){ queueAction('requisicao',payload); toast('Sem conexão — solicitação guardada neste aparelho, será enviada quando a conexão voltar.','warn'); finish(); return; }
  sb.from('requisicoes').insert(payload).then(({error})=>{ if(error){toast('Erro ao enviar: '+error.message,'err');return;} toast(mutuoFields.mutuo_empresa_destino?'Solicitação enviada para aprovação — o mútuo será registrado automaticamente na separação.':'Solicitação enviada para aprovação.','ok'); refreshAprovBadge(); refreshGlobalAlerts(); finish(); });
}

/* ===== AJUSTE DE SALDO (lançamento direto, sem nota fiscal) ===== */
function renderAjuste(){
  if(!isEncarregado()){ $('#view').innerHTML='<div class="tbl-wrap"><div class="empty">Acesso restrito a encarregados/administradores.</div></div>'; return; }
  if(needObra())return;
  $('#view').innerHTML=`<div class="panel"><h3>Ajuste de saldo</h3><p class="desc">Lança um saldo inicial ou corrige o estoque de um produto <b>sem passar por nota fiscal</b>. Fica registrado na auditoria como "ajuste".</p>
    <div class="field" style="max-width:320px"><label>Obra</label><select id="ajObra">${obraOptions(curObra()==='__all'?(state.obras[0]&&state.obras[0].id):curObra(),false)}</select></div>
    <div class="search" style="max-width:none"><span class="si">⌕</span><input id="ajSearch" placeholder="Nome ou código do produto..." autocomplete="off"></div>
    <div id="ajResults"></div>
    <div id="ajForm"></div>
    <details style="margin-top:16px"><summary style="cursor:pointer;color:var(--muted);font-size:12.5px">Produto ainda não existe? Cadastrar novo</summary>
      <div class="row c3" style="margin-top:10px">
        <div class="field" style="margin:0"><label>Código</label><input id="ajNewCode" placeholder="deixe em branco p/ gerar"></div>
        <div class="field" style="margin:0"><label>Descrição</label><input id="ajNewDesc"></div>
        <div class="field" style="margin:0"><label>Unidade</label><input id="ajNewUnit" value="UN"></div>
      </div>
      <button class="btn ghost sm" style="margin-top:8px" onclick="criarProdutoAjuste()">+ Cadastrar e selecionar</button>
    </details></div>`;
  $('#ajSearch').oninput=e=>drawAjResults(e.target.value);
  $('#ajObra').onchange=()=>{ $('#ajForm').innerHTML=''; };
}
function drawAjResults(q){ const box=$('#ajResults'); if(!box)return; const list=searchProducts(q).slice(0,8); if(!q||!list.length){box.innerHTML='';return;}
  box.innerHTML=`<div class="tbl-wrap" style="margin:6px 0 10px"><table><tbody>`+list.map(p=>`<tr><td>${esc(p.desc)}<br><span class="muted" style="font-size:11px">${esc(p.code)}</span></td><td class="num"><button class="btn ghost sm" onclick="selecionarAjuste('${esc(p.code)}')">Selecionar</button></td></tr>`).join('')+`</tbody></table></div>`; }
function criarProdutoAjuste(){ const desc=$('#ajNewDesc').value.trim(); if(!desc){toast('Informe a descrição.','err');return;}
  const code=$('#ajNewCode').value.trim()||genCode(); if(findProduct(code)){toast('Já existe um produto com esse código.','err');return;}
  const unit=$('#ajNewUnit').value.trim()||'UN'; state.products.push({code,desc,unit,aux:'',min:0,max:0,custo:0,preco:0,ref:''}); save('Produto cadastrado via ajuste: '+desc);
  toast('Produto cadastrado.','ok'); selecionarAjuste(code); }
function selecionarAjuste(code){ const p=findProduct(code); if(!p)return; const obra=$('#ajObra').value; const atual=saldoOf(obra,code);
  $('#ajSearch').value=p.desc; $('#ajResults').innerHTML='';
  $('#ajForm').innerHTML=`<div class="panel" style="background:var(--panel2);margin-top:12px"><h3 style="margin-bottom:4px">${esc(p.desc)} <span class="muted" style="font-size:12px">(${esc(p.code)})</span></h3>
    <p class="desc">Saldo atual em <b>${esc(obraName(obra))}</b>: <b>${numf(atual)} ${esc(p.unit||'')}</b> · custo médio atual: <b>${money(p.custo||0)}</b></p>
    <div class="row c2">
      <div class="field" style="margin:0"><label>Novo saldo</label><input id="ajNovoSaldo" type="number" step="any" value="${atual}"></div>
      <div class="field" style="margin:0"><label>Valor de compra (custo unitário)</label><input id="ajCusto" type="number" step="any" min="0" value="${p.custo||0}"></div>
    </div>
    <div class="field"><label>Motivo / observação</label><input id="ajMotivo" placeholder="ex.: saldo inicial, contagem física..."></div>
    <button class="btn primary" onclick="aplicarAjuste('${esc(code)}')">Aplicar ajuste</button></div>`; }
function aplicarAjuste(code){ const p=findProduct(code); if(!p)return; const obra=$('#ajObra').value; const atual=saldoOf(obra,code);
  const novo=parseFloat($('#ajNovoSaldo').value); if(isNaN(novo)||novo<0){toast('Informe um saldo válido.','err');return;}
  const delta=novo-atual; if(delta===0){toast('Nenhuma mudança — o saldo já é esse.','err');return;}
  const custoInformado=parseFloat($('#ajCusto').value); const motivo=$('#ajMotivo').value.trim()||'Ajuste manual';
  let custoFinal=p.custo||0;
  if(!isNaN(custoInformado)&&custoInformado>=0){
    if(delta>0){ custoFinal = novo>0 ? (((atual*(p.custo||0))+(delta*custoInformado))/novo) : custoInformado; }
    else { custoFinal = custoInformado; }
  }
  requireSupervisor(`Ajustar saldo de "${p.desc}" em ${obraName(obra)} de ${numf(atual)} para ${numf(novo)}`,async()=>{
    addSaldo(obra,code,delta); p.custo=custoFinal;
    state.movements.unshift({id:uid(),ts:Date.now(),tipo:'ajuste',obra,code:p.code,desc:p.desc,qty:delta,valorUnit:custoFinal,valorTotal:delta*custoFinal,doc:'Ajuste: '+motivo,saldo:saldoOf(obra,code)});
    toast('Salvando...','warn');
    await save('Ajuste de saldo: '+p.desc+' em '+obraName(obra)+' ('+(delta>0?'+':'')+numf(delta)+') · '+motivo);
    toast('Saldo ajustado e salvo.','ok'); renderAjuste(); }); }

function reqStatusLabel(s){ return {pendente:'Pendente',aprovada:'Aprovada',rejeitada:'Rejeitada',cancelada:'Cancelada',em_separacao:'Em separação',aguardando_compra:'Aguardando compra',separado:'Separado',embalado:'Embalado',romaneio_emitido:'Romaneio emitido',faturado:'Faturado',embarcado:'Embarcado (despacho)',retirado:'Retirado (interna)',recebido:'Recebido'}[s]||s; }
async function cancelarRequisicao(id){ const {error}=await sb.from('requisicoes').update({status:'cancelada'}).eq('id',id); if(error){toast('Erro: '+error.message,'err');return;} toast('Requisição cancelada.','warn'); if(activeTab==='baixa')drawMinhasFrotasPendentes(); refreshAprovBadge(); refreshGlobalAlerts(); }

/* ===== APROVAÇÕES (encarregado / admin) ===== */
async function renderAprovacoes(){
  if(!isEncarregado()){ $('#view').innerHTML='<div class="tbl-wrap"><div class="empty">Acesso restrito a encarregados/administradores.</div></div>'; return; }
  const vinc=Array.isArray(profile.obras_vinculadas)?profile.obras_vinculadas:[];
  const aviso=(!isAdmin()&&!vinc.length)?`<div class="empty" style="padding:14px 18px;margin-bottom:18px;text-align:left;background:#fff3da;border-radius:10px">⚠ Você ainda não tem nenhuma obra (centro de custo) vinculada. Peça a um administrador para vincular suas obras em Administração → Usuários.</div>`:
    (!isAdmin()?`<div class="muted" style="font-size:12px;margin-bottom:14px">Mostrando apenas requisições das obras vinculadas a você: ${vinc.map(id=>esc(obraName(id))).join(', ')}.</div>`:'');
  $('#view').innerHTML=aviso+`<div class="sechead"><h3>Pendentes de aprovação</h3></div><div class="tbl-wrap" id="aprovPend" style="margin-bottom:26px"><div class="empty">Carregando...</div></div>

async function drawAprovPend(){ const box=$('#aprovPend'); if(!box)return;

    (data||[]).map(r=>`<tr><td class="mono">REQ-${String(r.id).padStart(5,'0')}</td><td class="muted" style="font-size:12px">${fmtDate(new Date(r.criado_em).getTime())}</td><td>${esc(r.obra_nome)}${r.ordem_servico?'<br><span class="muted" style="font-size:11px">OS '+esc(r.ordem_servico)+'</span>':''}</td><td>${esc(r.aplicacao_nome||'—')}</td><td>${esc(r.solicitante_nome)}</td><td>${r.itens.map(i=>esc(i.desc)+' ('+numf(i.qty)+' '+esc(i.unit||'')+')').join(', ')}</td><td class="muted" style="font-size:12px">${esc(r.observacao||'—')}</td><td class="num" style="white-space:nowrap"><button class="btn primary sm" onclick="aprovarRequisicao(${r.id})">✔ Aprovar</button> <button class="btn danger sm" onclick="rejeitarRequisicao(${r.id})">✕ Rejeitar</button></td></tr>`).join('')||`<tr><td colspan="8" class="empty" style="padding:24px">Nenhum pedido pendente.</td></tr>`}</tbody></table>`; }

    (data||[]).map(r=>`<tr><td class="mono">REQ-${String(r.id).padStart(5,'0')}</td><td>${esc(r.obra_nome)}${r.ordem_servico?'<br><span class="muted" style="font-size:11px">OS '+esc(r.ordem_servico)+'</span>':''}</td><td>${esc(r.aplicacao_nome||'—')}</td><td>${esc(r.solicitante_nome)}</td><td><span class="pill ${r.status}">${reqStatusLabel(r.status)}</span>${r.motivo_rejeicao?`<br><span class="muted" style="font-size:11px">${esc(r.motivo_rejeicao)}</span>`:''}</td><td>${esc(r.decidido_por_nome||'—')}</td><td class="muted" style="font-size:12px">${r.decidido_em?fmtDate(new Date(r.decidido_em).getTime()):'—'}</td>${isAdmin()?`<td class="num" style="white-space:nowrap"><button class="btn ghost sm" onclick="excluirEventoSeparacao(${r.id})">Excluir separação</button> <button class="btn danger sm" onclick="excluirRequisicaoAdmin(${r.id})">Excluir REQ</button></td>`:''}</tr>`).join('')||`<tr><td colspan="${isAdmin()?8:7}" class="empty" style="padding:24px">Nenhuma decisão ainda.</td></tr>`}</tbody></table>`; }
async function excluirEventoSeparacao(reqId){
  if(!isAdmin()){toast('Apenas administradores podem excluir o evento de separação.','err');return;}
  requireSupervisor('Excluir separação da REQ-'+String(reqId).padStart(5,'0')+' (estorna o estoque separado)',async()=>{
    const {data:r,error:e1}=await sb.from('requisicoes').select('*').eq('id',reqId).maybeSingle();
    if(e1||!r){toast('Erro ao carregar requisição.','err');return;}
    const {data:itens,error:e2}=await sb.from('requisicao_itens_status').select('*').eq('requisicao_id',reqId);
    if(e2){toast('Erro: '+e2.message,'err');return;}
    const separados=(itens||[]).filter(i=>i.quantidade_separada>0);
    if(!separados.length){toast('Não há separação ativa nesta requisição.','err');return;}
    separados.forEach(i=>addSaldo(r.obra_id,i.code,i.quantidade_separada));
    state.movements=state.movements.filter(m=>!(m.tipo==='baixa'&&m.obs==='Separação REQ-'+String(reqId).padStart(5,'0')));
    await save('Separação da REQ-'+String(reqId).padStart(5,'0')+' excluída (estorno de estoque)');
    for(const i of separados){
      const novaDisp=i.quantidade_disponivel+i.quantidade_separada;
      const novoStatus=novaDisp>=i.quantidade_solicitada?'disponivel':'faltante';

async function aprovarRequisicao(id){
  const {data:r,error:e1}=await sb.from('requisicoes').select('*').eq('id',id).maybeSingle();
  if(e1||!r){toast('Erro ao carregar pedido.','err');return;}
  if(!podeAprovarObra(r.obra_id)){toast('Você não está vinculado à obra (centro de custo) desta requisição.','err');return;}
  // Verifica o saldo item a item — não bloqueia mais a aprovação por falta de estoque.
  const itensAvaliados=r.itens.map(i=>{
    const disponivel=Math.max(Math.min(saldoOf(r.obra_id,i.code), i.qty),0);
    return {code:i.code, desc:i.desc, unit:i.unit||'', qty:i.qty, disponivel, faltante:Math.max(i.qty-disponivel,0)};
  });
  const temFaltante=itensAvaliados.some(i=>i.faltante>0);
  const rowsStatus=itensAvaliados.map(i=>({
    requisicao_id:r.id, code:i.code, descricao:i.desc, unidade:i.unit,
    quantidade_solicitada:i.qty, quantidade_disponivel:i.disponivel,
    status: i.faltante>0?'faltante':'disponivel'
  }));
  const {error:e2}=await sb.from('requisicao_itens_status').upsert(rowsStatus,{onConflict:'requisicao_id,code'});
  if(e2){toast('Erro ao gravar verificação de estoque: '+e2.message,'err');return;}
  const faltantes=itensAvaliados.filter(i=>i.faltante>0);
  if(faltantes.length){
    const rowsCompra=faltantes.map(i=>({requisicao_id:r.id, code:i.code, descricao:i.desc, quantidade:i.faltante, status:'pendente'}));
    const {error:e3}=await sb.from('compras_pendentes').insert(rowsCompra);
    if(e3){toast('Verificação salva, mas houve erro ao gerar compra pendente: '+e3.message,'err');return;}
  }
  const novoStatus=temFaltante?'aguardando_compra':'em_separacao';
  const {error:e4}=await sb.from('requisicoes').update({status:novoStatus,decidido_por:session.user.id,decidido_por_nome:profile.nome||profile.email,decidido_em:new Date().toISOString()}).eq('id',id);
  if(e4){toast('Erro ao atualizar a requisição: '+e4.message,'err');return;}
  toast(temFaltante?'Requisição aprovada. Itens faltantes enviados para compras.':'Requisição aprovada — pronta para separação.','ok');
  drawAprovPend(); drawAprovHist(); refreshAprovBadge(); refreshSeparacaoBadge(); refreshComprasBadge(); refreshMinhasBadge(); refreshGlobalAlerts(); }

async function separarItem(id){

const EXPED_STAGES=['Separado','Embalado','Romaneio','Nota Fiscal','Etiquetas','Envio'];

function expedDoneCount(r,caixas){
  if(r.status==='embarcado'||r.status==='retirado'||r.status==='recebido')return 6;
  if(r.status==='faturado'){ const todas=caixas.length>0&&caixas.every(c=>c.status!=='em_montagem'&&c.status!=='fechada'); return todas?5:4; }
  if(r.status==='romaneio_emitido')return 3;
  if(r.status==='embalado')return 2;
  if(r.status==='separado')return 1;
  return 0;
}
function expedStepperHTML(r,caixas){
  const done=expedDoneCount(r,caixas);
  return `<div class="stepper">${EXPED_STAGES.map((lbl,i)=>{ const n=i+1; const cls=n<done?'done':n===done?'current':'';
    return `<div class="st ${cls}"><div class="dot">${n<done?'✓':n}</div><div class="lbl">${lbl}</div></div>`; }).join('')}</div>`;
}

function definirTipoEnvio(reqId){ const tipo=document.querySelector('input[name=tipoEnvioPre]:checked').value;

function voltarEtapa(reqId){
  const {r,caixas}=window._expedCtx;
  const map={embalado:'separado',romaneio_emitido:'embalado',faturado:'romaneio_emitido',embarcado:'faturado',retirado:'faturado'};
  const prev=map[r.status]; if(!prev)return;
  requireSupervisor('Voltar REQ-'+String(reqId).padStart(5,'0')+' para a etapa anterior ('+reqStatusLabel(prev)+')',async()=>{
    if(r.status==='faturado'){
      const {nf}=window._expedCtx; if(nf) await sb.from('notas_fiscais_saida').update({status:'cancelada'}).eq('id',nf.id);
      const etiquetadas=caixas.filter(c=>c.status==='etiquetada'); if(etiquetadas.length) await sb.from('caixas').update({status:'fechada'}).in('id',etiquetadas.map(c=>c.id));
    } else if(r.status==='embarcado'){ const {emb}=window._expedCtx; if(emb) await sb.from('embarques').delete().eq('id',emb.id); }
    else if(r.status==='retirado'){ const {ret}=window._expedCtx; if(ret) await sb.from('retiradas_internas').delete().eq('id',ret.id); }
    else if(r.status==='embalado'){
      const fechadas=caixas.filter(c=>c.status==='fechada'); if(fechadas.length) await sb.from('caixas').update({status:'em_montagem',data_fechamento:null}).in('id',fechadas.map(c=>c.id));
    }
    const {error}=await sb.from('requisicoes').update({status:prev}).eq('id',reqId);
    if(error){toast('Erro: '+error.message,'err');return;}
    toast('Voltou para: '+reqStatusLabel(prev),'warn');
    await abrirExpedicao(reqId); drawExpedicaoList(); refreshExpedBadge(); refreshRetiradasBadge();
  });
}

const STATUS_AINDA_NAO_SAIU=['em_separacao','aguardando_compra','separado','embalado','romaneio_emitido','faturado'];
let _retiradasFiltro='';
async function refreshRetiradasBadge(){ if(!podeVerRetiradas())return; const b=$('#navBadgeRetiradas'); if(!b)return;

  if(count){b.textContent=count;b.style.display='';}else b.style.display='none'; refreshFluxoGroupBadge(); }
function diasParado(ts){ return Math.max(0,Math.floor((Date.now()-ts)/86400000)); }
function envioTipoLabel(tipo){ return tipo==='despacho'?'🚚 Despacho':tipo==='interna'?'🤝 Retirada no balcão':'❓ Envio não definido'; }
async function renderRetiradaPendente(){
  if(!podeVerRetiradas()){ $('#view').innerHTML='<div class="tbl-wrap"><div class="empty">Acesso restrito ao almoxarifado e encarregados/administradores.</div></div>'; return; }
  $('#view').innerHTML=`<div class="panel" style="margin-bottom:14px"><div class="field" style="max-width:280px;margin:0"><label>Filtrar por tipo de envio</label>
    <select id="retFiltro" onchange="_retiradasFiltro=this.value;drawRetiradaPendente()">
      <option value="" ${_retiradasFiltro===''?'selected':''}>Todos</option>
      <option value="despacho" ${_retiradasFiltro==='despacho'?'selected':''}>🚚 Despacho</option>
      <option value="interna" ${_retiradasFiltro==='interna'?'selected':''}>🤝 Retirada no balcão</option>
      <option value="_indef" ${_retiradasFiltro==='_indef'?'selected':''}>❓ Envio não definido</option>
    </select></div></div>
    <div id="retList"><div class="empty">Carregando...</div></div>`;
  await drawRetiradaPendente();
}
async function drawRetiradaPendente(){ const box=$('#retList'); if(!box)return;
  const {data,error}=await sb.from('requisicao_itens_status').select('*, requisicoes(id,obra_nome,ordem_servico,status,tipo_envio,criado_em)').gt('quantidade_separada',0).order('atualizado_em',{ascending:true});
  if(error){box.innerHTML='<div class="tbl-wrap"><div class="empty">Erro: '+esc(error.message)+'</div></div>';return;}
  const itens=(data||[]).filter(i=>i.requisicoes&&STATUS_AINDA_NAO_SAIU.includes(i.requisicoes.status));
  const grupos={};
  itens.forEach(i=>{ const r=i.requisicoes; if(!grupos[r.id])grupos[r.id]={r,itens:[],maisAntigo:i.atualizado_em}; grupos[r.id].itens.push(i);
    if(new Date(i.atualizado_em).getTime()<new Date(grupos[r.id].maisAntigo).getTime())grupos[r.id].maisAntigo=i.atualizado_em; });
  let lista=Object.values(grupos);
  if(_retiradasFiltro==='_indef')lista=lista.filter(g=>!g.r.tipo_envio);
  else if(_retiradasFiltro)lista=lista.filter(g=>g.r.tipo_envio===_retiradasFiltro);
  lista.sort((a,b)=>new Date(a.maisAntigo).getTime()-new Date(b.maisAntigo).getTime());
  if(!lista.length){box.innerHTML='<div class="tbl-wrap"><div class="empty">Nenhum material separado aguardando retirada no momento.</div></div>';return;}
  box.innerHTML=lista.map(g=>{ const r=g.r; const dias=diasParado(new Date(g.maisAntigo).getTime());
    const corDias=dias>=7?'low':dias>=3?'high':'good';
    const corEnvio=r.tipo_envio==='despacho'?'tr':r.tipo_envio==='interna'?'good':'high';
    return `<div class="panel" style="margin-bottom:14px;cursor:pointer" onclick="abrirExpedicao(${r.id})">
      <div class="sechead" style="margin-bottom:6px;flex-wrap:wrap;gap:8px"><h3 style="font-size:14px">REQ-${String(r.id).padStart(5,'0')} — ${esc(r.obra_nome)}${r.ordem_servico?' · OS '+esc(r.ordem_servico):''}</h3>
        <span class="pill ${r.status}">${reqStatusLabel(r.status)}</span>
        <span class="pill ${corEnvio}">${envioTipoLabel(r.tipo_envio)}</span>
        <span class="pill ${corDias}">${dias===0?'separado hoje':dias===1?'separado há 1 dia':'separado há '+dias+' dias'}</span></div>
      <div class="tbl-wrap"><table><thead><tr><th>Item</th><th class="num">Qtd. separada</th></tr></thead><tbody>${
        g.itens.map(i=>`<tr><td>${esc(i.descricao)}</td><td class="num">${numf(i.quantidade_separada)} ${esc(i.unidade||'')}</td></tr>`).join('')
      }</tbody></table></div></div>`; }).join('');
}

function checkTrEmpresa(){ const box=$('#trEmpresaWarn'); if(!box)return;
  const orig=state.obras.find(o=>o.id===$('#trOrig').value), dest=state.obras.find(o=>o.id===$('#trDest').value);

  if(diverge){
    box.innerHTML=`<div style="background:#fdeaea;border:1px solid #e0a0a0;border-radius:8px;padding:10px 14px;margin:8px 0;font-size:12.5px;color:#a02525">⛔ <b>${esc(orig.nome)}</b> (${esc(orig.empresa)}) e <b>${esc(dest.nome)}</b> (${esc(dest.empresa)}) são de empresas diferentes. Transferência direta não é permitida entre empresas — faça a <b>baixa por consumo</b> na origem e registre o valor como <b>mútuo entre empresas</b> (aba Mútuo).</div>`;
    if(btn){btn.disabled=true;btn.style.opacity='.5';btn.style.cursor='not-allowed';}
  } else { box.innerHTML=''; if(btn){btn.disabled=false;btn.style.opacity='';btn.style.cursor='';} }

function trOrigId(){ return $('#trOrig')?$('#trOrig').value:(state.obras[0]&&state.obras[0].id); }
function drawTrResults(q){ const box=$('#trResults'); if(!box)return; const orig=trOrigId(); const list=searchProducts(q).filter(p=>saldoOf(orig,p.code)>0).slice(0,8); if(!q){box.innerHTML='';return;} if(!list.length){box.innerHTML=`<div class="muted" style="font-size:12px;padding:8px 2px">Nenhum item com saldo na obra de origem.</div>`;return;}
  box.innerHTML=`<div class="tbl-wrap" style="margin-top:10px"><table><tbody>`+list.map(p=>`<tr><td>${esc(p.desc)}<br><span class="muted" style="font-size:11px">${esc(p.code)}${p.aux?' · aux '+esc(p.aux):''} · saldo ${numf(saldoOf(orig,p.code))} ${esc(p.unit||'')}</span></td><td class="num" style="width:80px"><button class="btn ghost sm" onclick="addTr('${esc(p.code)}')">+ Add</button></td></tr>`).join('')+`</tbody></table></div>`; }
function addTr(code){ const orig=trOrigId(); if(saldoOf(orig,code)<=0){toast('Item sem saldo na obra de origem.','err');return;} if(!trCart.some(i=>i.code===code))trCart.push({code,qty:1}); if($('#trScan'))$('#trScan').value=''; if($('#trResults'))$('#trResults').innerHTML=''; drawTrCart(); if($('#trScan'))$('#trScan').focus(); }
function rmTr(code){ trCart=trCart.filter(i=>i.code!==code); drawTrCart(); }
function setTrQty(code,v){ const it=trCart.find(i=>i.code===code); if(it)it.qty=parseFloat(v)||0; const p=findProduct(code); const cell=$('#tv_'+CSS.escape(code)); if(cell&&p)cell.textContent=money((it?it.qty:0)*((p.custo)||0)); updateTrTotal(); }
function updateTrTotal(){ const el=$('#trTotal'); if(!el)return; let t=0; trCart.forEach(i=>{const p=findProduct(i.code); t+=(i.qty||0)*((p&&p.custo)||0);}); el.textContent=money(t); }
function drawTrCart(){ const b=$('#trCartBody'); if(!b)return; const orig=trOrigId();
  if(!trCart.length){ b.innerHTML=`<tr><td colspan="5" class="empty" style="padding:20px">Nenhum item. Pesquise acima e adicione.</td></tr>`; updateTrTotal(); return; }
  b.innerHTML=trCart.map(i=>{const p=findProduct(i.code);const s=saldoOf(orig,i.code);const tot=(i.qty||0)*((p.custo)||0);return `<tr><td>${esc(p.desc)}<br><span class="muted" style="font-size:11px">${esc(p.code)}${p.aux?' · aux '+esc(p.aux):''}</span></td><td class="num ${i.qty>s?'neg':''}">${numf(s)} ${esc(p.unit||'')}</td><td class="num"><input class="inline-edit" type="number" step="any" min="0" value="${i.qty}" oninput="setTrQty('${esc(i.code)}',this.value)"></td><td class="num" id="tv_${esc(i.code)}">${money(tot)}</td><td class="num"><button class="btn danger sm" onclick="rmTr('${esc(i.code)}')">✕</button></td></tr>`;}).join(''); updateTrTotal(); }
function drawTrHist(){ const list=state.movements.filter(m=>m.tipo==='transferencia').slice(0,40);
  $('#trHist').innerHTML=list.length?list.map(m=>`<tr><td class="muted" style="font-size:12px">${fmtDate(m.ts)}</td><td class="mono">${m.seq?seqf(m.seq):'—'}</td><td style="font-size:12.5px">${esc(obraName(m.obra))} → ${esc(obraName(m.obraDest))}</td><td>${esc(m.desc)}${m.obs?`<br><span class="muted" style="font-size:11px">obs: ${esc(m.obs)}</span>`:''}</td><td class="num"><span class="pill tr">${numf(m.qty)}</span></td><td class="num">${money(m.valorTotal)}</td><td class="num"><button class="btn ghost sm" title="Romaneio (agrupado)" onclick="reportRomaneio('${m.romaneioId||m.id}')">🖨</button> <button class="btn danger sm" title="Excluir e estornar (supervisor)" onclick="delTrMov('${m.id}')">🗑</button></td></tr>`).join(''):`<tr><td colspan="7" class="empty" style="padding:24px">Nenhuma transferência.</td></tr>`; }
function delTrMov(id){ const m=state.movements.find(x=>x.id===id&&x.tipo==='transferencia'); if(!m)return; requireSupervisor('Excluir transferência Nº '+seqf(m.seq),()=>{ addSaldo(m.obra,m.code,m.qty); addSaldo(m.obraDest,m.code,-m.qty); state.movements=state.movements.filter(x=>x.id!==id); save('Transferência Nº '+seqf(m.seq)+' excluída e estornada'); drawTrHist(); toast('Transferência excluída e estornada.','warn'); }); }
function confirmTransfer(){ const orig=$('#trOrig').value, dest=$('#trDest').value;
  if(orig===dest){toast('Origem e destino devem ser diferentes.','err');return;}
  const oOrig=state.obras.find(o=>o.id===orig), oDest=state.obras.find(o=>o.id===dest);
  if(oOrig&&oDest&&oOrig.empresa&&oDest.empresa&&oOrig.empresa.trim().toLowerCase()!==oDest.empresa.trim().toLowerCase()){
    toast('Empresas diferentes — transferência direta não é permitida. Faça baixa por consumo e registre o mútuo.','err'); return; }
  if(!trCart.length){toast('Adicione itens.','err');return;}
  const itens=trCart.filter(i=>i.qty>0); if(!itens.length){toast('Informe as quantidades.','err');return;}
  for(const i of itens){ const s=saldoOf(orig,i.code); if(i.qty>s){const p=findProduct(i.code); toast(`Saldo insuficiente: ${p.desc} (${numf(s)}).`,'err'); return;} }
  const wantReport=$('#trReport')&&$('#trReport').checked; const obs=($('#trObs')?$('#trObs').value.trim():''); const seq=++state.seq.transfer; const romaneioId=uid(); const ts=Date.now(); const repItens=[];
  itens.forEach(i=>{const p=findProduct(i.code); const vu=p.custo||0; addSaldo(orig,p.code,-i.qty); addSaldo(dest,p.code,i.qty);
    state.movements.unshift({id:uid(),ts,seq,romaneioId,tipo:'transferencia',obra:orig,obraDest:dest,obs,code:p.code,desc:p.desc,qty:i.qty,valorUnit:vu,valorTotal:i.qty*vu,doc:`Romaneio Nº ${seqf(seq)} · ${obraName(orig)} → ${obraName(dest)}`,saldo:saldoOf(orig,p.code),saldoDest:saldoOf(dest,p.code)});
    repItens.push({code:p.code,aux:p.aux,desc:p.desc,qty:i.qty,unit:p.unit,valor:vu}); });
  save('Transferência Nº '+seqf(seq)+' · '+obraName(orig)+' → '+obraName(dest)); toast(`Romaneio Nº ${seqf(seq)} · ${itens.length} item(ns) · ${esc(obraName(orig))} → ${esc(obraName(dest))}`,'ok');
  if(wantReport)printSignReport({titulo:'Romaneio de Transferência de Estoque',numero:seqf(seq),conferencia:true,recebimento:true,subtitulo:'Movimentação entre obras',data:fmtDate(ts),obra:obraName(orig),obraDest:obraName(dest),obs,itens:repItens,assinaturas:['Responsável obra origem','Responsável obra destino','Transportador / Conferente']});
  trCart=[]; drawTrCart(); drawTrHist(); if($('#trScan'))$('#trScan').focus(); }
function reportRomaneio(id){ const ms=state.movements.filter(m=>m.tipo==='transferencia'&&(m.romaneioId||m.id)===id); if(!ms.length)return; const m0=ms[0];
  const itens=ms.map(m=>{const p=findProduct(m.code); return {code:m.code,aux:p?p.aux:'',desc:m.desc,qty:m.qty,unit:p?p.unit:'',valor:m.valorUnit};});
  printSignReport({titulo:'Romaneio de Transferência de Estoque',numero:seqf(m0.seq),conferencia:true,recebimento:true,subtitulo:'Movimentação entre obras',data:fmtDate(m0.ts),obra:obraName(m0.obra),obraDest:obraName(m0.obraDest),obs:m0.obs,itens,assinaturas:['Responsável obra origem','Responsável obra destino','Transportador / Conferente']}); }

  $('#view').innerHTML=`<div class="panel"><h3>💱 Mútuo entre empresas</h3><p class="desc">Quando um material sai do estoque de uma empresa e é usado por outra (obras de razões sociais diferentes), a transferência direta não é permitida — faça a baixa por consumo na origem e registre aqui o valor que uma empresa passa a dever à outra.</p></div>

async function drawMutuoAbertos(){ const box=$('#mutuoAbertos'); if(!box)return;
  const {data,error}=await sb.from('mutuos_intercompany').select('*').eq('status','aberto').order('criado_em',{ascending:true});
  if(error){box.innerHTML='<div class="tbl-wrap"><div class="empty">Erro: '+esc(error.message)+'</div></div>';return;}

  const groups={};

let importRows=[];
const COLMAP={codigo:'code','código':'code',code:'code',descricao:'desc','descrição':'desc',produto:'desc',nome:'desc',unidade:'unit',unid:'unit',un:'unit',quantidade:'qty',qtd:'qty',saldo:'qty',estoque:'qty',minimo:'min','mínimo':'min',min:'min',maximo:'max','máximo':'max',max:'max',custo:'custo','custo unitario':'custo',valor:'custo',preco:'preco','preço':'preco',venda:'preco',referencia:'ref','referência':'ref',aplicacao:'ref','aplicação':'ref','codigo auxiliar':'aux','código auxiliar':'aux','cod auxiliar':'aux',auxiliar:'aux','codigo outro sistema':'aux','outro sistema':'aux'};
function renderImportar(){ if(needObra())return;
  $('#view').innerHTML=`<div class="panel"><h3>Carga inicial por planilha</h3><p class="desc">Importe Excel/CSV para a obra selecionada. Produtos existentes têm o saldo <b>somado</b> na obra.</p>

    <div class="field" style="max-width:340px;margin-top:14px"><label>Obra de destino</label><select id="impObra">${obraOptions(curObra()==='__all'?(state.obras[0]&&state.obras[0].id):curObra(),false)}</select></div>
    <div class="filebox" onclick="document.getElementById('fileInput').click()"><div class="ico">↥</div><b>Selecionar planilha</b><br><span class="muted" style="font-size:12px">.xlsx, .xls ou .csv</span><input type="file" id="fileInput" accept=".xlsx,.xls,.csv" style="display:none"></div>
    <div class="help"><b>Colunas:</b> <code>codigo</code> · <code>codigo auxiliar</code> · <code>descricao</code> · <code>unidade</code> · <code>quantidade</code> · <code>minimo</code> · <code>maximo</code> · <code>custo</code> · <code>preco</code> · <code>referencia</code><br>Código vazio gera etiqueta automática.</div></div>
    <div id="importPreview"></div>`;
  $('#fileInput').onchange=handleFile; }
async function handleFile(e){ const f=e.target.files[0]; if(!f)return;
  try{ await ensureXLSX(); }catch(err){ toast('Não foi possível carregar o leitor de planilha (verifique a conexão).','err'); return; }
  const r=new FileReader();
  r.onload=ev=>{ try{ const wb=XLSX.read(ev.target.result,{type:'binary'}); const json=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});
    if(!json.length){toast('Planilha vazia.','err');return;}
    importRows=json.map(row=>{ const o={}; Object.keys(row).forEach(k=>{const key=COLMAP[String(k).trim().toLowerCase().replace(/\s+/g,' ')]; if(key)o[key]=row[k];});
      const num=v=>parseFloat(String(v).replace(',','.'))||0;
      return {code:String(o.code||'').trim(),desc:String(o.desc||'').trim(),unit:String(o.unit||'UN').trim()||'UN',aux:String(o.aux||'').trim(),qty:num(o.qty),min:num(o.min),max:num(o.max),custo:num(o.custo),preco:num(o.preco),ref:String(o.ref||'').trim()}; }).filter(r=>r.desc);
    previewImport(); }catch(err){toast('Erro: '+err.message,'err');} };
  r.readAsBinaryString(f); }
function previewImport(){ if(!importRows.length){toast('Nenhuma linha válida.','err');return;} const box=$('#importPreview');
  box.innerHTML=`<div class="sechead"><h3>Pré-visualização · ${importRows.length} linha(s) → ${esc(obraName($('#impObra').value))}</h3><button class="btn primary sm" onclick="commitImport()">✓ Confirmar</button></div>
  <div class="tbl-wrap"><table><thead><tr><th>Código</th><th>Descrição</th><th>Un.</th><th class="num">Qtd</th><th class="num">Mín</th><th class="num">Máx</th><th class="num">Custo</th><th>Ação</th></tr></thead><tbody>`+importRows.map(r=>{const ex=r.code&&findProduct(r.code);return `<tr><td class="mono">${r.code?esc(r.code):'<span class="muted">auto</span>'}</td><td>${esc(r.desc)}</td><td>${esc(r.unit)}</td><td class="num">${numf(r.qty)}</td><td class="num">${numf(r.min)}</td><td class="num">${r.max>0?numf(r.max):'—'}</td><td class="num">${money(r.custo)}</td><td>${ex?'<span class="pill high">Atualiza</span>':'<span class="pill good">Novo</span>'}</td></tr>`;}).join('')+`</tbody></table></div>`; }
function commitImport(){ const obra=$('#impObra').value; let novos=0,atual=0;
  importRows.forEach(r=>{ let p=r.code?findProduct(r.code):null;
    if(p){ p.desc=r.desc||p.desc;p.unit=r.unit||p.unit;p.min=r.min;p.max=r.max;if(r.custo>0)p.custo=r.custo;if(r.preco>0)p.preco=r.preco;if(r.ref)p.ref=r.ref;if(r.aux)p.aux=r.aux; atual++; }
    else{ const code=r.code||genCode(); p={code,desc:r.desc,unit:r.unit,aux:r.aux,min:r.min,max:r.max,custo:r.custo,preco:r.preco,ref:r.ref}; state.products.push(p); novos++; }
    if(r.qty>0){ addSaldo(obra,p.code,r.qty); state.movements.unshift({ts:Date.now(),tipo:'entrada',obra,code:p.code,desc:p.desc,qty:r.qty,valorUnit:p.custo||0,valorTotal:r.qty*(p.custo||0),doc:'Carga inicial (planilha)',saldo:saldoOf(obra,p.code)}); } });
  save('Importação de planilha em '+obraName(obra)+' · '+novos+' novo(s), '+atual+' atualizado(s)'); importRows=[]; toast(`Importado em ${esc(obraName(obra))} · ${novos} novo(s), ${atual} atualizado(s).`,'ok'); go('produtos'); }
async function downloadTemplate(){

  const ws=XLSX.utils.aoa_to_sheet([['codigo','codigo auxiliar','descricao','unidade','quantidade','minimo','maximo','custo','preco','referencia'],['','SAP-1001','Cimento CP-II 50kg','SC',120,30,300,32.50,41.90,''],['','SAP-2050','Filtro hidráulico 1234','UN',8,2,20,180.00,0,'Escavadeira CAT 320'],['7891234560001','','Areia média','M3',15,5,40,55.00,90.00,'']]);
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'Produtos'); XLSX.writeFile(wb,'modelo_estoque.xlsx'); }

      const tIn=inP.filter(m=>m.tipo==='transferencia'&&m.obraDest===o.id).reduce((s,m)=>s+m.valorTotal,0);
      const tOut=inP.filter(m=>m.tipo==='transferencia'&&m.obra===o.id).reduce((s,m)=>s+m.valorTotal,0);
      const estoque=state.products.filter(p=>produtoPassaFiltros(p,gf,lf,pf)).reduce((s,p)=>s+saldoOf(o.id,p.code)*(p.custo||0),0);
      return {nome:o.nome,ent,bx,tIn,tOut,estoque}; });
    headers=['Obra','Entradas','Baixas','Transf. recebidas','Transf. enviadas','Valor em estoque'];
    rows=arr.map(a=>[a.nome,money(a.ent),money(a.bx),money(a.tIn),money(a.tOut),money(a.estoque)]);
    const S=k=>arr.reduce((s,a)=>s+a[k],0);
    foot=['Total',money(S('ent')),money(S('bx')),money(S('tIn')),money(S('tOut')),money(S('estoque'))];
  } else if(relTipo==='grupo'){
    titulo='Insumos cadastrados por grupo';
    const list=state.products.filter(p=>produtoPassaFiltros(p,gf,lf,pf))
      .map(p=>{ const s=isAll?totalSaldo(p.code):saldoOf(fobra,p.code); return {grupo:produtoGrupo(p.code),code:p.code,aux:p.aux||'',desc:p.desc,unit:p.unit||'',saldo:s,valor:s*(p.custo||0)}; })
      .sort((a,b)=>(a.grupo==='(sem grupo)'?1:b.grupo==='(sem grupo)'?-1:a.grupo.localeCompare(b.grupo,'pt-BR'))||a.desc.localeCompare(b.desc,'pt-BR'));
    headers=['Grupo do insumo','Código','Código auxiliar','Insumo (descrição)','Saldo','Valor em estoque'];
    rows=list.map(a=>[a.grupo,a.code,a.aux||'—',a.desc+(a.unit?' ('+a.unit+')':''),numf(a.saldo),money(a.valor)]);
    foot=['Total','','',list.length+' insumo(s)',numf(list.reduce((s,a)=>s+a.saldo,0)),money(list.reduce((s,a)=>s+a.valor,0))];
    periodoLbl=(isAll?'Todas as obras':obraName(fobra))+(gf?' · grupo: '+gf:'')+' · cadastro atual (não depende do período)';
  } else if(relTipo==='os'){
    titulo='Insumos aplicados por Ordem de Serviço';
    const rowsRaw=inP.filter(m=>m.tipo==='baixa'&&movOS(m)).map(m=>{const p=findProduct(m.code); return {os:movOS(m),obra:obraName(m.obra),aplic:m.aplic?aplicName(m.aplic):'—',desc:m.desc,code:m.code,unit:p?(p.unit||''):'',qty:m.qty,valor:m.valorTotal,ts:m.ts};})
      .sort((a,b)=>a.os.localeCompare(b.os,'pt-BR',{numeric:true})||a.ts-b.ts);
    headers=['Ordem de Serviço','Obra','Aplicação/Equipamento','Insumo','Qtd','Valor'];
    rows=rowsRaw.map(a=>[a.os,a.obra,a.aplic,a.desc+' ('+a.code+')',numf(a.qty)+' '+a.unit,money(a.valor)]);
    foot=['Total','','','',numf(rowsRaw.reduce((s,a)=>s+a.qty,0)),money(rowsRaw.reduce((s,a)=>s+a.valor,0))];
  } else if(relTipo==='consorcio'){
    const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    let destObras=state.obras.filter(o=>norm(o.nome).includes('consorcio'));
    titulo='Materiais transferidos para Consórcio (nota de débito)';
    if(!isAll) destObras=destObras.filter(o=>o.id===fobra);
    if(!destObras.length){
      headers=['Aviso']; rows=[]; foot=null;
      periodoLbl=!isAll?('A obra selecionada ("'+obraName(fobra)+'") não tem "Consórcio" no nome. Escolha "Todas as obras" ou um consórcio específico.'):'Nenhuma obra com "Consórcio" no nome foi encontrada no cadastro de Obras.';
    } else {
      const destIds=destObras.map(o=>o.id);
      let rowsRaw=state.movements.filter(m=>m.tipo==='transferencia'&&destIds.includes(m.obraDest)).filter(m=>{const d=mdate(m,emi); return d>=f&&d<=t;});
      if(gf)rowsRaw=rowsRaw.filter(m=>produtoGrupo(m.code)===gf);
      if(lf)rowsRaw=rowsRaw.filter(m=>produtoLocal(m.code)===lf);
      if(pf)rowsRaw=rowsRaw.filter(m=>{const p=findProduct(m.code); return p&&(p.desc.toLowerCase().includes(pf)||String(p.code).toLowerCase().includes(pf)||(p.aux&&String(p.aux).toLowerCase().includes(pf)));});
      rowsRaw.sort((a,b)=>(a.seq||0)-(b.seq||0)||a.ts-b.ts);
      headers=['Nº Romaneio','Data','Obra de origem','Obra Consórcio','Insumo','Qtd','Valor Unitário','Valor Total'];
      rows=rowsRaw.map(m=>{const p=findProduct(m.code); return [m.seq?seqf(m.seq):'—',fmtDate(m.ts),obraName(m.obra),obraName(m.obraDest),m.desc+' ('+m.code+')'+(p&&p.unit?' - '+esc(p.unit):''),numf(m.qty),money(m.valorUnit),money(m.valorTotal)];});
      foot=['Total','','','','',numf(rowsRaw.reduce((s,m)=>s+m.qty,0)),'',money(rowsRaw.reduce((s,m)=>s+m.valorTotal,0))];
      periodoLbl=`${new Date(f).toLocaleDateString('pt-BR')} a ${new Date(t).toLocaleDateString('pt-BR')} · destino(s): ${destObras.map(o=>o.nome).join(', ')}`;
    }
  } else {
    titulo='Movimentação por produto';
    const g={}; inP.forEach(m=>{ if(m.tipo==='transferencia')return; if(!g[m.code])g[m.code]={entQ:0,entV:0,bxQ:0,bxV:0}; if(m.tipo==='entrada'){g[m.code].entQ+=m.qty;g[m.code].entV+=m.valorTotal;} else if(m.tipo==='baixa'){g[m.code].bxQ+=m.qty;g[m.code].bxV+=m.valorTotal;} });
    const arr=Object.entries(g).map(([code,v])=>{const p=findProduct(code); return {code,desc:p?p.desc:code,unit:p?(p.unit||''):'',saldo:isAll?totalSaldo(code):saldoOf(fobra,code),...v};}).sort((a,b)=>b.bxV-a.bxV);
    headers=['Produto','Entradas (qtd)','Entradas (R$)','Saídas (qtd)','Saídas (R$)','Saldo atual'];
    rows=arr.map(a=>[`${a.desc} (${a.code})`,`${numf(a.entQ)} ${a.unit}`,money(a.entV),`${numf(a.bxQ)} ${a.unit}`,money(a.bxV),`${numf(a.saldo)} ${a.unit}`]);
    foot=['Total','',money(arr.reduce((s,a)=>s+a.entV,0)),'',money(arr.reduce((s,a)=>s+a.bxV,0)),''];
  }
  _rel={titulo,sub:periodoLbl,headers,rows,foot};
  box.innerHTML=`<div class="sechead"><h3>${esc(titulo)}</h3><span style="font-size:12px;color:#8a8377">${esc(periodoLbl)}</span></div>
    <div class="tbl-wrap"><table><thead><tr>${headers.map((h,i)=>`<th${i>0?' class="num"':''}>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.map(r=>`<tr>${r.map((c,i)=>`<td${i>0?' class="num"':''}>${esc(c)}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${headers.length}" class="empty" style="padding:24px">Sem dados no período.</td></tr>`}</tbody>${rows.length&&foot?`<tfoot><tr>${foot.map((c,i)=>`<td${i>0?' class="num"':''}><b>${esc(c)}</b></td>`).join('')}</tr></tfoot>`:''}</table></div>`;
}
function drawABC(inP,isAll,fobra,periodoLbl){ const box=$('#relView'); if(!box)return;
  const bx=inP.filter(m=>m.tipo==='baixa'); let metric={}, itemLabel, titulo;
  if(relTipo==='aplicacao'){ itemLabel='Aplicação'; titulo='Curva ABC — consumo por aplicação';
    bx.forEach(m=>{const k=m.aplic||'__sem'; metric[k]=(metric[k]||0)+m.valorTotal;});
    metric=Object.entries(metric).map(([k,v])=>({nome:k==='__sem'?'(sem aplicação)':(state.aplicacoes.find(a=>a.id===k)?aplicName(k):'(removida)'),valor:v}));
  } else if(relTipo==='tipo'){ itemLabel='Tipo de aplicação'; titulo='Curva ABC — consumo por tipo';
    bx.forEach(m=>{const a=state.aplicacoes.find(x=>x.id===m.aplic); let k=a?(a.tipo==='sede'?'sede:'+(a.sub||''):a.tipo):'__sem'; metric[k]=(metric[k]||0)+m.valorTotal;});
    const lbl=k=>{ if(k==='__sem')return '(sem aplicação)'; if(k.indexOf('sede:')===0){const s=SEDE_SUB.find(x=>x[0]===k.slice(5)); return 'SEDE — '+(s?s[1]:k.slice(5));} const x=APLIC_TIPOS.find(y=>y[0]===k); return x?x[1]:k; };
    metric=Object.entries(metric).map(([k,v])=>({nome:lbl(k),valor:v}));
  } else if(relTipo==='obra'){ itemLabel='Obra'; titulo='Curva ABC — consumo por obra';
    bx.forEach(m=>{metric[m.obra]=(metric[m.obra]||0)+m.valorTotal;});
    metric=Object.entries(metric).map(([k,v])=>({nome:obraName(k),valor:v}));
  } else { itemLabel='Produto'; titulo='Curva ABC — consumo por produto';
    bx.forEach(m=>{metric[m.code]=(metric[m.code]||0)+m.valorTotal;});
    metric=Object.entries(metric).map(([k,v])=>{const p=findProduct(k); return {nome:(p?p.desc:k)+' ('+k+')',valor:v};});
  }
  metric.sort((a,b)=>b.valor-a.valor);
  const tot=metric.reduce((s,x)=>s+x.valor,0)||1; let acc=0; const cnt={A:0,B:0,C:0}, valc={A:0,B:0,C:0};
  metric.forEach(x=>{ acc+=x.valor; const ap=acc/tot*100; x.pct=x.valor/tot*100; x.accpct=ap; x.classe= ap<=80?'A':(ap<=95?'B':'C'); cnt[x.classe]++; valc[x.classe]+=x.valor; });
  const headers=[itemLabel,'Valor (baixas)','% do total','% acumulado','Classe'];
  const rows=metric.map(x=>[x.nome,money(x.valor),x.pct.toFixed(1)+'%',x.accpct.toFixed(1)+'%',x.classe]);
  const tv=metric.reduce((s,x)=>s+x.valor,0);
  _rel={titulo,sub:periodoLbl+' · A até 80% · B até 95% · C até 100% (por valor de consumo)',headers,rows,foot:['Total',money(tv),'100%','','']};
  const pill=c=>`<span class="pill ${c==='A'?'good':c==='B'?'high':'low'}" style="font-weight:700">${c}</span>`;
  box.innerHTML=`<div class="sechead"><h3>${esc(titulo)}</h3><span style="font-size:12px;color:#8a8377">${esc(periodoLbl)}</span></div>
    <div class="cards" style="margin-bottom:16px">
      <div class="card ok"><div class="stripe"></div><div class="lbl">Classe A</div><div class="val">${cnt.A}</div><div class="sub">${money(valc.A)} · ${(valc.A/tot*100).toFixed(0)}% do valor</div></div>
      <div class="card warn"><div class="stripe"></div><div class="lbl">Classe B</div><div class="val">${cnt.B}</div><div class="sub">${money(valc.B)} · ${(valc.B/tot*100).toFixed(0)}% do valor</div></div>
      <div class="card neutral"><div class="stripe"></div><div class="lbl">Classe C</div><div class="val">${cnt.C}</div><div class="sub">${money(valc.C)} · ${(valc.C/tot*100).toFixed(0)}% do valor</div></div>
    </div>
    <div class="tbl-wrap"><table><thead><tr><th>${esc(itemLabel)}</th><th class="num">Valor (baixas)</th><th class="num">% do total</th><th class="num">% acumulado</th><th>Classe</th></tr></thead><tbody>${metric.length?metric.map(x=>`<tr><td>${esc(x.nome)}</td><td class="num">${money(x.valor)}</td><td class="num">${x.pct.toFixed(1)}%</td><td class="num">${x.accpct.toFixed(1)}%</td><td>${pill(x.classe)}</td></tr>`).join(''):`<tr><td colspan="5" class="empty" style="padding:24px">Sem consumo no período.</td></tr>`}</tbody>${metric.length?`<tfoot><tr><td><b>Total</b></td><td class="num"><b>${money(tv)}</b></td><td class="num"><b>100%</b></td><td></td><td></td></tr></tfoot>`:''}</table></div>`;
}
function printRelatorio(){ if(!_rel||!_rel.rows.length){toast('Sem dados para imprimir.','err');return;} const w=window.open('','_blank'); if(!w){toast('Permita pop-ups para gerar o relatório.','err');return;}
  const head=_rel.headers.map((h,i)=>`<th style="${i>0?'text-align:right':''}">${esc(h)}</th>`).join('');
  const body=_rel.rows.map(r=>`<tr>${r.map((c,i)=>`<td style="${i>0?'text-align:right':''}">${esc(c)}</td>`).join('')}</tr>`).join('');
  const foot=_rel.foot?`<tfoot><tr>${_rel.foot.map((c,i)=>`<td style="${i>0?'text-align:right':''};font-weight:bold;background:#f6f6f6">${esc(c)}</td>`).join('')}</tr></tfoot>`:'';
  w.document.write(`<html><head><title>${esc(_rel.titulo)}</title><style>body{font-family:Arial,Helvetica,sans-serif;margin:32px;color:#111}h1{font-size:18px;margin:0 0 2px}.sub{color:#555;font-size:12px;margin-bottom:14px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #999;padding:6px 8px;font-size:11.5px}th{background:#eee;text-align:left}</style></head><body><h1>${esc(_rel.titulo)}</h1><div class="sub">${esc(_rel.sub)} · gerado em ${esc(fmtDate(Date.now()))}</div><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody>${foot}</table><script>setTimeout(()=>window.print(),300);<\/script></body></html>`); w.document.close(); }

/* ===== Ordenação de tabelas e MAIÚSCULAS ===== */
function cellKey(txt){ txt=(txt||'').replace(/\s+/g,' ').trim().replace(/\u2212/g,'-');
  const dm=txt.match(/^(\d{2})\/(\d{2})\/(\d{4})/); if(dm)return {n:+(dm[3]+dm[2]+dm[1]),s:txt.toLowerCase()};
  const m=txt.match(/^[R$\s-]*(-?\d[\d.]*(?:,\d+)?)/);
  if(m && /^[R$\s-]*-?[\d.,]+\s*[a-zA-Z³ºª%]*$/.test(txt)){ let t=m[1]; if(t.indexOf(',')>-1)t=t.replace(/\./g,'').replace(',','.'); else if((t.match(/\./g)||[]).length>1)t=t.replace(/\./g,''); const n=parseFloat(t); if(!isNaN(n))return {n,s:txt.toLowerCase()}; }
  return {n:null,s:txt.toLowerCase()}; }
document.addEventListener('click',function(e){ const th=e.target.closest('th'); if(!th)return; const table=th.closest('table'); if(!table||!table.closest('.tbl-wrap'))return;
  const tbody=table.tBodies[0]; if(!tbody)return; const ths=[...th.parentNode.children]; const idx=ths.indexOf(th);
  let rows=[...tbody.rows].filter(r=>r.cells.length>1 && !r.querySelector('.empty')); if(rows.length<2)return;
  const cellTxt=r=>{ const c=r.cells[idx]; if(!c)return ''; const f=c.querySelector('input,select,textarea'); return f?(f.value||''):c.textContent; };
  const asc=!(table.dataset.sc==idx && table.dataset.sd==='asc'); table.dataset.sc=idx; table.dataset.sd=asc?'asc':'desc';
  rows.map(r=>[cellKey(cellTxt(r)),r]).sort((a,b)=>{const A=a[0],B=b[0]; if(A.n!=null&&B.n!=null)return asc?A.n-B.n:B.n-A.n; if(A.n!=null)return asc?-1:1; if(B.n!=null)return asc?1:-1; return asc?A.s.localeCompare(B.s,'pt-BR'):B.s.localeCompare(A.s,'pt-BR');}).forEach(x=>tbody.appendChild(x[1]));
  ths.forEach(h=>{const i=h.querySelector('.si-sort'); if(i)i.remove();}); const ind=document.createElement('span'); ind.className='si-sort'; ind.style.cssText='font-size:9px;opacity:.6;margin-left:3px'; ind.textContent=asc?'▲':'▼'; th.appendChild(ind); });
document.addEventListener('input',function(e){ const el=e.target; if(!el||(el.tagName!=='INPUT'&&el.tagName!=='TEXTAREA'))return; const t=(el.type||'text').toLowerCase(); if(['password','number','date','datetime-local','time','email','file','checkbox','radio','color','range'].includes(t))return; if(el.dataset.noupper!==undefined)return; const a=el.selectionStart,b=el.selectionEnd; const up=el.value.toUpperCase(); if(up!==el.value){ el.value=up; try{el.setSelectionRange(a,b);}catch(_){} } });
(function(){ const s=document.createElement('style'); s.textContent='.tbl-wrap table thead th{cursor:pointer;user-select:none}.tbl-wrap table thead th:hover{background:#e4dfd4}'; document.head.appendChild(s); })();
